# NOTE: this is NOT a monorepo workspace. pnpm 11 stores its settings in this
# file even for single-package projects. There is intentionally no `packages:`
# key — the app stays a single pnpm package (see docs/plans/knx-mbm-mvp.md).
allowBuilds:
  # tsx (scripts/verify-xbl.ts runner) wraps esbuild; its postinstall links the binary.
  # Native serial transport for the gateway's USB console.
  '@serialport/bindings-cpp': true
  esbuild: true
  unrs-resolver: true
